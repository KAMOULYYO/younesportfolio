<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.svg" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Younes Kamouly — Full Stack Developer</title>
    <meta name="description" content="Portfolio de Younes Kamouly, développeur Full Stack spécialisé en React, FastAPI, MongoDB et intégration IA. Basé à Montréal." />
    <meta name="keywords" content="Younes Kamouly, développeur full stack, React, FastAPI, MongoDB, TypeScript, IA, Montréal" />
    <meta name="author" content="Younes Kamouly" />

    <!-- Open Graph (réseaux sociaux) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Younes Kamouly — Full Stack Developer" />
    <meta property="og:description" content="Portfolio de Younes Kamouly, développeur Full Stack spécialisé en React, FastAPI, MongoDB et intégration IA." />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:locale" content="fr_CA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Younes Kamouly — Full Stack Developer" />
    <meta name="twitter:description" content="Portfolio de Younes Kamouly, développeur Full Stack." />
    <meta name="twitter:image" content="/favicon.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#080808" />

    <!-- SPA redirect for GitHub Pages -->
    <script>
      (function(l){if(l.search[1]==='/'){{var d=l.search.slice(1).split('&').map(function(s){{return s.replace(/~and~/g,'&')}}).join('?');window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);}}}(window.location))
    </script>

    <!-- Fonts — chargement asynchrone pour éviter le blocage du rendu -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
